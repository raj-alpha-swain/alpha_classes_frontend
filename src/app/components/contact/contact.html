<section class="section contact" id="contact">
  <div class="container">
    <div class="section-head center">
      <span class="eyebrow" appReveal>Get in touch</span>
      <h2 appReveal [revealDelay]="80">Book a <em class="accent grad-text">demo class</em></h2>
      <p appReveal [revealDelay]="160">Message us on WhatsApp for the quickest reply, or send an email — we're happy to answer any question.</p>
    </div>

    <div class="options">
      <a class="option wa" [href]="whatsappLink" target="_blank" rel="noopener" appTilt [maxTilt]="5" appReveal="left" [revealDelay]="100">
        <span class="glow" aria-hidden="true"></span>
        <span class="badge">
          <svg viewBox="0 0 32 32" aria-hidden="true"><path fill="currentColor" d="M16.04 3C9.4 3 4 8.36 4 14.97c0 2.11.56 4.17 1.62 5.99L4 29l8.27-1.6a12.1 12.1 0 0 0 3.77.6C22.68 28 28 22.62 28 16.01 28 9.4 22.68 3 16.04 3Zm5.36 15.44c-.29-.15-1.73-.85-2-.95-.27-.1-.47-.15-.66.15-.2.29-.76.94-.93 1.13-.17.2-.34.22-.63.07-.3-.15-1.24-.46-2.36-1.46-.87-.78-1.46-1.73-1.63-2.03-.17-.29-.02-.45.13-.6.13-.13.3-.34.44-.51.15-.17.2-.3.3-.49.1-.2.05-.37-.03-.51-.07-.15-.66-1.6-.9-2.18-.24-.57-.48-.5-.66-.5h-.56c-.2 0-.51.07-.78.37-.27.29-1.02 1-1.02 2.44s1.05 2.83 1.2 3.03c.14.2 2.05 3.13 4.98 4.39 2.94 1.27 2.94.85 3.47.8.53-.05 1.73-.7 1.97-1.39.25-.68.25-1.27.17-1.39-.07-.12-.27-.2-.56-.34Z"/></svg>
        </span>
        <span class="label">WhatsApp · fastest reply</span>
        <strong class="value">{{ c.whatsappDisplay }}</strong>
        <span class="cta">Start chat <span class="arrow">→</span></span>
      </a>

      <div class="option mail" appTilt [maxTilt]="5" appReveal="right" [revealDelay]="200">
        <span class="glow" aria-hidden="true"></span>
        <span class="badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
        </span>
        <span class="label">Gmail</span>
        <strong class="value addr">{{ c.email }}</strong>
        <span class="mail-actions">
          <a class="cta" [href]="gmailLink" target="_blank" rel="noopener">Open in Gmail <span class="arrow">→</span></a>
          <a class="small" [href]="mailtoLink">Email app</a>
          <button type="button" class="small copy" (click)="copyEmail()">{{ copied() ? '✓ Copied' : 'Copy' }}</button>
        </span>
      </div>
    </div>
  </div>
</section>
